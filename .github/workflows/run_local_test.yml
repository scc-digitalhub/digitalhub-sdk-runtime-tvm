name: Run Unit Local Test via Pytest

on:
  push:
  workflow_dispatch:
    inputs:
      core_schema_ref:
        description: CORE schema revision (use an immutable commit for coordinated integration tests)
        required: true
        default: main
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # You can test your matrix by printing the current Python version
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check --output-format=github .
        continue-on-error: true
      - name: Check out CORE schemas
        uses: actions/checkout@v4
        with:
          repository: scc-digitalhub/digitalhub-core
          ref: ${{ inputs.core_schema_ref || 'main' }}
          path: core-schema-source
      - name: Get schema files from core
        run: |
          cp -R core-schema-source/schemas/specs test/instances/schemas
          git -C core-schema-source rev-parse HEAD
      - uses: actions/checkout@v4
        with:
          repository: scc-digitalhub/digitalhub-sdk
          ref: main
          path: digitalhub-sdk
      - name: Test with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/digitalhub-sdk:${{ github.workspace }}/digitalhub-sdk/test/_digitalhub_test_helpers
          TVM_REQUIRE_CORE_SCHEMAS: "1"
          TVM_CORE_SCHEMA_DIR: ${{ github.workspace }}/test/instances/schemas
        run: |
          coverage run -m pytest test -v -s
      - name: Generate Coverage Report
        run: |
          coverage report -m
